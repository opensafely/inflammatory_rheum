      --diseases_list eia rheumatoid psa axialspa undiffia gca sjogren ssc sle myositis anca
      --disease "anca"
      --intervals 9
    needs: [generate_dataset_prevalence]
    outputs:
      highly_sensitive:
        measure_csv: output/measures/measures_prevalence_anca.csv

  prevalence_cleaning:
    run: stata-mp:latest analysis/004_prevalence_cleaning.do "eia|rheumatoid|psa|axialspa|undiffia|gca|sjogren|ssc|sle|myositis|anca"
    needs: [generate_dataset_prevalence, prevalence_measures_eia, prevalence_measures_rheumatoid, prevalence_measures_psa, prevalence_measures_axialspa, prevalence_measures_undiffia, prevalence_measures_gca, prevalence_measures_sjogren, prevalence_measures_ssc, prevalence_measures_sle, prevalence_measures_myositis, prevalence_measures_anca]
    outputs:
      moderately_sensitive:
        log1: logs/prevalence_cleaning.log   
        table1: output/tables/prevalence_rates_rounded.csv

  prevalence_graphs:
    run: stata-mp:latest analysis/005_prevalence_graphs.do "eia|rheumatoid|psa|axialspa|undiffia|gca|sjogren|ssc|sle|myositis|anca" "2020-03-01"
    needs: [prevalence_cleaning]
    outputs:
      moderately_sensitive:
        log1: logs/prevalence_graphs.log   
        figure1: output/figures/prev_adj_*.svg
        figure2: output/figures/prev_comp_*.svg  

  generate_dataset_gca:
      run: ehrql:v1 generate-dataset analysis/dataset_definition_gca.py 
        --output output/dataset_gca.csv
        --
        --studystart_date "2016-04-01"
        --studyend_date "2025-03-31"
        --studyfup_date "2025-09-30"
        --diseases_list eia rheumatoid psa axialspa undiffia gca sjogren ssc sle myositis anca
        --registration_months 12
      needs: [generate_dataset_incidence]
      outputs:
        highly_sensitive:
          cohort: output/dataset_gca.csv

